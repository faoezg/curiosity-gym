[project]
name = "curiosity-gym"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.12"
authors = [{name = "Chris Reimann"}, {name = "Fabian Kvas"}, {name = "Fatih Özgan"}]
dependencies = [
    "asttokens==2.4.1",
    "cloudpickle==3.1.0",
    "colorama==0.4.6",
    "comm==0.2.2",
    "contourpy==1.3.0",
    "cycler==0.12.1",
    "debugpy==1.8.7",
    "decorator==5.1.1",
    "executing==2.1.0",
    "farama-notifications==0.0.4",
    "filelock==3.16.1",
    "fonttools==4.54.1",
    "fsspec==2024.10.0",
    "gymnasium[atari]",
    "imageio>=2.37.2",
    "ipykernel==6.29.5",
    "ipython==8.29.0",
    "jedi==0.19.1",
    "jinja2==3.1.4",
    "jupyter-client==8.6.3",
    "jupyter-core==5.7.2",
    "kiwisolver==1.4.7",
    "markupsafe==3.0.2",
    "matplotlib==3.9.2",
    "matplotlib-inline==0.1.7",
    "moviepy>=2.2.1",
    "mpmath==1.3.0",
    "nest-asyncio==1.6.0",
    "networkx==3.4.2",
    "numpy==2.1.2",
    "opencv-python>=4.13.0.92",
    "packaging==24.1",
    "pandas==2.2.3",
    "parso==0.8.4",
    "pillow==11.0.0",
    "platformdirs==4.3.6",
    "prompt-toolkit==3.0.48",
    "psutil==6.1.0",
    "pure-eval==0.2.3",
    "pygame==2.6.1",
    "pygments==2.18.0",
    "pyparsing==3.2.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2024.2",
    "pywin32==308; sys_platform == 'win32'",
    "pyzmq==26.2.0",
    "rich>=14.3.3",
    "seaborn==0.13.2",
    "setuptools==75.2.0",
    "six==1.16.0",
    "stable-baselines3>=2.8.0",
    "stack-data==0.6.3",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
    "tornado>=6.4.1",
    "tqdm>=4.67.3",
    "traitlets==5.14.3",
    "typing-extensions==4.12.2",
    "tyro>=0.9.17",
    "tzdata==2024.2",
    "wandb>=0.25.0",
    "wcwidth==0.2.13",
]

[build-system]
requires = ["uv_build >= 0.8.17, <0.9.0"]
build-backend = "uv_build"

[project.urls]
Documentation = "https://curiosity-gym.readthedocs.io/"

[dependency-groups]
dev = [
    "ruff>=0.13.2",
]

[tool.setuptools.packages.find]
wherer = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
